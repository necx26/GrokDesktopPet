name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build standalone Windows executable
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Check executable
        shell: pwsh
        run: |
          if (-not (Test-Path ./artifacts/GrokPet.exe)) { throw 'Executable missing' }
          Get-FileHash ./artifacts/GrokPet.exe -Algorithm SHA256
